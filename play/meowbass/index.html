<div class="play"><header class="phd"><a class="brand" href="/"><svg class="logo" viewBox="0 0 48 48" aria-hidden="true"><path d="M8 40V10l9 8h14l9-8v30z" fill="none" stroke="#ff6aa5" stroke-width="3.5" stroke-linejoin="round"/><circle cx="18" cy="28" r="2.4" fill="#2dd4bf"/><circle cx="30" cy="28" r="2.4" fill="#2dd4bf"/><path d="M3 30l7 1M3 36l7-2M45 30l-7 1M45 36l-7-2" stroke="#2dd4bf" stroke-width="2.2" stroke-linecap="round"/></svg>STUDIO 87</a><span class="pt">Meowbass<small>interactive demo</small></span>
<div class="pr"><button class="tog" id="tog" type="button" aria-label="Switch between light and dark mode">Theme</button><a class="xbtn" id="xb" href="/meowbass/" aria-label="Close the demo and go back to Meowbass">&#10005; Close</a></div></header>

<script>
(function(){var b=document.getElementById('tog');if(!b)return;var r=document.documentElement;
function cur(){var t=r.getAttribute('data-theme');if(t)return t;return window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'}
function label(){b.textContent=cur()==='dark'?'Light':'Dark'}
b.addEventListener('click',function(){var n=cur()==='dark'?'light':'dark';r.setAttribute('data-theme',n);try{localStorage.setItem('s87-theme',n)}catch(e){}label()});label()})();

(function(){var back=document.getElementById('xb').getAttribute('href');function esc(e){if(e.key==='Escape')location.href=back}document.addEventListener('keydown',esc);
