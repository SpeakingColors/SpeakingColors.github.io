<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meow Flipper, Studio 87 design mockup v4.14</title>
<style>
:root{
  --ground:#0b0b0d;--panel:#15161a;--panel2:#1c1d22;--line:#2b2d34;--display:#06080a;--grid:#1b2523;
  --text:#f4f5f7;--dim:#a9adb8;--a1:#02EBBA;--a2:#FF1383;--a3:#A43DFF;--a4:#FFD100;
  --self:#241238;--selb:#CD92FE;--selt:#E1CBF4;--title:#E1CBF4;--arc:#02EBBA;--wv1:#02EBBA;--wv2:#CD92FE;
  --mb:#6CC9F5;--mp:#A43DFF;--mk:#FF1383;
  --fh:"Barlow Condensed","Arial Narrow","Roboto Condensed",Arial,sans-serif;
  --fm:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
:root[data-theme="A"]{--ground:#161638;--panel:#1c1c4a;--panel2:#2C2C62;--line:#3a3f7a;--display:#05060d;--grid:#1a2030;--text:#e8e6e1;--dim:#9a9690;--a1:#02EBBA;--a2:#FF1383;--a3:#6CC9F5;--a4:#FFA600;--self:#2C2C62;--selb:#FFA600;--selt:#E1CBF4;--title:#E1CBF4;--arc:#FFA600;--wv1:#02EBBA;--wv2:#6CC9F5}
:root[data-theme="C"]{--ground:#101012;--panel:#1d1d1f;--panel2:#26262a;--line:#34343a;--display:#0a0a0b;--grid:#1c1c20;--text:#ffffff;--dim:#a8a8b0;--a1:#02EBBA;--a2:#FF1383;--a3:#6CC9F5;--a4:#FFD100;--self:#2e2e34;--selb:#ffffff;--selt:#ffffff;--title:#d9d9de;--arc:#e6e6ea;--wv1:#d9d9de;--wv2:#ffffff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#050507;color:var(--text);font-family:var(--fh);overflow:hidden}
#view{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
#wrap{position:relative;flex:none}
#stage{position:absolute;left:0;top:0;width:1120px;height:610px;transform-origin:0 0;background:var(--ground);user-select:none;-webkit-user-select:none;overflow:hidden}
.cheek{position:absolute;top:0;bottom:0;width:24px;cursor:default}
#cheekL{left:0}#cheekR{right:0}
#ui{position:absolute;left:24px;right:24px;top:0;bottom:0;padding:6px 6px 4px;display:flex;flex-direction:column;gap:5px}
header{height:40px;display:flex;align-items:center;gap:8px;white-space:nowrap;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:0 12px;flex:none}
.logo{width:30px;height:30px;flex:none}
.brand{display:flex;flex-direction:column;line-height:1}
.brand b{font-size:15px;letter-spacing:.06em;font-weight:700}
.brand i{font-style:normal;font-size:10px;color:var(--dim);letter-spacing:.2em}
.sp{flex:1}
.pm{display:flex;align-items:center;gap:5px}
.btn{font-family:var(--fh);font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:4px 10px;cursor:pointer;line-height:1.1}
.btn:hover{border-color:var(--selb)}
.btn.on{background:var(--self);border-color:var(--selb);color:var(--selt)}
.btn.sm{padding:3px 7px;font-size:14px}
select.btn{padding:4px 6px;text-transform:none;letter-spacing:.02em}
header .btn{padding:4px 5px;font-size:11px}
header .btn.sm{padding:3px 5px;font-size:11px}
.pm select{width:120px;font-size:14px}
#main{flex:1;display:flex;gap:8px;min-height:0}
#disps{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
.disp{flex:1;display:flex;flex-direction:column;min-height:0}
.dt{height:16px;font-size:12px;letter-spacing:.16em;color:var(--title);display:flex;gap:14px;align-items:center;text-transform:uppercase}
.dt span{color:var(--dim);letter-spacing:.04em;text-transform:none;font-size:12px}
.cv{position:relative;flex:1;background:var(--display);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.cv canvas{position:absolute;left:0;top:0;width:100%;height:100%}
#dropmsg{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:34px;letter-spacing:.2em;color:var(--a1);background:rgba(0,0,0,.6);z-index:3}
.cv.drag #dropmsg{display:flex}
#meters{width:150px;flex:none;background:var(--panel);border:1px solid var(--line);border-radius:8px;position:relative}
#meters canvas{position:absolute;inset:0;width:100%;height:100%}
#bottom{height:164px;flex:none;display:flex;gap:5px}
.pn{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 6px;display:flex;flex-direction:column;min-width:0}
.pn h3{margin:0 0 3px;font-size:12px;font-weight:600;letter-spacing:.2em;color:var(--title);text-transform:uppercase}
.knobs{display:flex;gap:0;flex:1;align-items:flex-start;justify-content:space-around}
.k{width:40px;display:flex;flex-direction:column;align-items:center;cursor:ns-resize;touch-action:none}
.k svg{display:block}
.kv{font-family:var(--fm);font-size:10px;color:var(--a4);height:13px;line-height:13px;white-space:nowrap}
.kl{font-size:10px;letter-spacing:0;color:var(--dim);white-space:nowrap;text-transform:uppercase}
#tp{width:148px;gap:3px;flex:none}
#tp .btn.sm,.sub .btn.sm{font-size:11px;padding:2px 5px}
.grp{display:flex;flex-direction:column;align-items:center}
.grp>.cap{font-size:9px;letter-spacing:.14em;color:var(--dim);height:10px;line-height:10px;text-transform:uppercase}
.grp>.gk{display:flex}
.row{display:flex;gap:5px;align-items:center}
.tb{width:34px;height:30px;display:flex;align-items:center;justify-content:center;padding:0}
.tb.big{width:40px}
.tb svg{width:18px;height:18px;fill:currentColor}
#play.on{background:var(--a1);color:#04120e;border-color:var(--a1)}
#cap.rec{background:var(--a2);border-color:var(--a2)}
.seg{display:flex}
.seg .btn{border-radius:0}.seg .btn:first-child{border-radius:6px 0 0 6px}.seg .btn:last-child{border-radius:0 6px 6px 0}
#time{font-family:var(--fm);font-size:11px;color:var(--dim);margin-left:auto;letter-spacing:0;font-weight:400;white-space:nowrap;text-transform:none}
#cvB{cursor:grab}
.kc{display:flex;flex-direction:column;align-items:center}
.sel{font-family:var(--fh);font-size:11px;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:4px;padding:0;width:52px;height:18px;align-self:start;margin-top:2px;font-size:10px}
.sub{display:flex;flex-direction:column;min-width:0}
.sub h4{margin:0 0 2px;height:20px;font-size:11px;font-weight:600;letter-spacing:.16em;color:var(--title);text-transform:uppercase;display:flex;align-items:center;gap:6px;white-space:nowrap}
#ord{display:flex;align-items:center;cursor:pointer;margin-top:6px}
.gr6{display:grid;grid-template-columns:repeat(6,1fr);flex:1;justify-items:center;align-items:start}
#cellEcho{position:relative;display:flex}
#nt{position:absolute;left:-8px;top:-3px;width:20px;height:20px;padding:0;font-size:13px;line-height:1;z-index:2;text-align:center}
.ccap{font-size:9px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase;align-self:start;justify-self:stretch;text-align:center;margin-top:-11px;height:10px;line-height:10px;border-bottom:1px solid var(--line);pointer-events:none}
.rw{display:flex;align-items:flex-start;flex:1;min-height:0}
.rl{width:58px;flex:none;display:flex;flex-direction:column;gap:3px;padding-top:2px}
.rl .t{font-size:11px;font-weight:600;letter-spacing:.16em;color:var(--title);text-transform:uppercase;display:flex;align-items:center;gap:6px}
.rw .knobs{justify-content:space-around;flex:1}
.gr{display:grid;gap:0;flex:1;align-content:start;justify-items:center}
.gr .cap{font-size:9px;letter-spacing:.14em;color:var(--dim);height:10px;line-height:10px;text-transform:uppercase;justify-self:stretch;text-align:center;border-bottom:1px solid var(--line)}
#ord .lb{font-size:9px;letter-spacing:.06em;color:var(--dim)}
#ord .ar{display:flex;gap:2px;font-family:var(--fm);font-size:20px;line-height:1}
#ord .ar b{color:var(--line);font-weight:700;padding:0 3px;border-radius:4px}
#ord .ar b.lit{color:var(--a4);background:var(--self);box-shadow:0 0 6px var(--a4)}
#bpm{width:46px;text-align:center;-moz-appearance:textfield;font-family:var(--fm);font-size:11px;background:var(--display);color:var(--a4);border:1px solid var(--line);border-radius:4px;padding:1px 0}
#bpm::-webkit-inner-spin-button{display:none}
#msr{font-family:var(--fm);font-size:10px;color:var(--dim);letter-spacing:0;text-transform:none;font-weight:400}
#eqc{flex:1;height:16px;margin-left:2px;position:relative;border-radius:3px;overflow:hidden}
#eqc canvas{position:absolute;inset:0;width:100%;height:100%}
#testrow{font-size:10px;color:var(--dim);display:flex;align-items:center;gap:5px}
#testrow select{flex:1;font-size:12px;padding:1px 2px;min-width:0}
footer{height:18px;flex:none;display:flex;align-items:center;font-family:var(--fm);font-size:11px;color:var(--dim);gap:10px}
footer .z .btn{padding:0 6px;font-size:13px;font-family:var(--fm);text-transform:none}
.hd{position:absolute;z-index:20;background:transparent}
.hd:hover{background:rgba(204,146,254,.25)}
#tip{position:fixed;z-index:60;display:none;max-width:300px;background:#0b0b0d;color:#f4f5f7;border:1px solid #CD92FE;border-radius:6px;padding:6px 9px;font-size:15px;line-height:1.15;pointer-events:none;font-family:var(--fh)}
#dlgbg{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.62);display:none;align-items:center;justify-content:center}
#dlg{background:#15161a;border:1px solid #CD92FE;border-radius:10px;padding:16px 18px;max-width:560px;width:90%;max-height:86vh;overflow:auto;color:#f4f5f7;font-family:var(--fh);font-size:17px;line-height:1.25}
#dlg h2{margin:0 0 8px;letter-spacing:.14em;font-size:22px;color:#E1CBF4}
#dlg input[type=text]{width:100%;font-size:18px;background:#06080a;color:#f4f5f7;border:1px solid #2b2d34;border-radius:6px;padding:6px 8px;font-family:var(--fh)}
#dlg .bb{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
#dlg ul{margin:6px 0;padding-left:20px}
#dlg label{display:flex;gap:8px;align-items:center;margin:6px 0}
#dlg .btn{font-size:16px}
.pn{padding:4px 6px}
.pn>h3{height:16px;margin:0 0 4px;display:flex;align-items:center;gap:8px;white-space:nowrap;flex:none}
.kg{display:grid;grid-template-rows:60px 18px 60px;column-gap:2px;justify-items:center;align-items:start;flex:1;min-height:0}
.kg .k{width:46px}
.kg .kl{max-width:52px;overflow:hidden;text-overflow:clip}
.bc{grid-row:2;align-self:center;justify-self:stretch;display:flex;align-items:center;gap:5px;height:14px;font-size:9px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase;border-bottom:1px solid var(--line);margin:0 4px}
.bc span{flex:1;text-align:center}
#nt{position:static;width:18px;height:14px;padding:0;font-size:11px;line-height:12px;border-radius:3px;flex:none}
.slot{display:flex;flex-direction:column;align-items:center;width:46px}
.selc{display:flex;flex-direction:column;align-items:center;width:52px}
.selc .sel{width:52px;height:20px;margin:7px 0 7px;align-self:center}
.selc .kv{height:13px}
#ord{margin:0 0 0 auto;gap:4px}
#ord .lb{font-size:9px}
#ord .ar{font-size:14px}
#ord .ar b{padding:0 3px}
#tp{justify-content:space-between}
#tp #time{text-align:center!important;align-self:stretch}
.pm select{width:170px}
#ord{gap:3px;margin-left:auto;cursor:pointer}
#ord .ch{font-size:9px;font-weight:600;letter-spacing:.08em;padding:1px 5px;border:1px solid var(--selb);border-radius:3px;color:var(--selt);background:var(--self)}
#ord i{font-style:normal;color:var(--a4);font-size:13px;line-height:1}
#ord:hover .ch{border-color:var(--a4)}
.tsel{font-family:var(--fh);font-size:10px;height:16px;padding:0 2px;background:var(--panel2);color:var(--selt);border:1px solid var(--selb);border-radius:3px;letter-spacing:.04em;text-transform:none;flex:none}
.bc .tsel{height:14px;font-size:9px;margin-left:auto}
.bc .bt{font-size:12px;font-weight:600;letter-spacing:.2em;color:var(--title)}
.bc:has(.bt){height:16px;border-bottom-color:var(--selb)}
.bc{height:18px;box-sizing:border-box;padding-bottom:3px;align-self:end}
.bc .tsel,.bc #nt{height:13px;line-height:11px}
#tp #time{margin-left:0}
#tp>h3{justify-content:center}
#tp>*{align-self:stretch}
#tp .row,#tp .seg,#tp #testrow{justify-content:center}
#tp .row .btn.sm{flex:1;white-space:nowrap}
#tp #cap{flex:1.5}
#tp .seg{display:flex}
#tp #testrow select{flex:1}
#kQ .pw,#kQ .so{font-size:10px;line-height:12px;width:13px;height:13px;text-align:center;border:1px solid var(--line);border-radius:3px;cursor:pointer;color:var(--dim);flex:none;font-weight:700}
#kQ .pw.on{color:var(--a1);border-color:var(--a1)}
#kQ .so.on{color:#111;background:var(--a4);border-color:var(--a4)}
#kQ .bc{gap:3px}
#eqc{cursor:pointer}
#eqt{margin-left:2px}
#eqBig{position:absolute;inset:0;width:100%;height:100%;display:none;cursor:crosshair;touch-action:none}
.cv.eqv #bBase,.cv.eqv #bOver{display:none}
.cv.eqv #eqBig{display:block}
.cv.eqv{cursor:default}
#vsel{margin-left:10px}
#vsel .btn{font-size:10px;padding:1px 6px}
#pBig{position:absolute;inset:0;width:100%;height:100%;display:none;cursor:crosshair;touch-action:none}
#pCtl{position:absolute;top:10px;right:8px;width:76px;display:none;flex-direction:column;align-items:center;gap:4px}
#pCtl .pl{font-size:9px;letter-spacing:.12em;color:var(--dim);margin-top:4px}
#pCtl .tsel{width:76px}
#pCtl .btn{width:76px;margin-top:4px;font-size:10px;padding:2px 0}
.cv.pv #bBase,.cv.pv #bOver{display:none}
.cv.pv #pBig{display:block}
.cv.pv #pCtl{display:flex}
.cv.pv{cursor:default}
#tsel{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:2px;width:46px}
#tsel .kl{font-size:9px;letter-spacing:.08em;color:var(--dim);line-height:12px}
#tsel .btn{font-size:16px;padding:0;width:40px;height:30px;line-height:28px;border-radius:6px;margin-top:4px}
</style>
<style>@font-face{font-family:"Barlow Condensed";font-weight:500;font-display:swap;src:url(/try/fonts/pack-barlow-condensed-latin-500-normal.woff2) format("woff2")}@font-face{font-family:"Barlow Condensed";font-weight:600;font-display:swap;src:url(/try/fonts/pack-barlow-condensed-latin-600-normal.woff2) format("woff2")}@font-face{font-family:"Barlow Condensed";font-weight:700;font-display:swap;src:url(/try/fonts/pack-barlow-condensed-latin-700-normal.woff2) format("woff2")}@font-face{font-family:"JetBrains Mono";font-weight:400;font-display:swap;src:url(/try/fonts/pack-jetbrains-mono-latin-400-normal.woff2) format("woff2")}@font-face{font-family:"JetBrains Mono";font-weight:500;font-display:swap;src:url(/try/fonts/pack-jetbrains-mono-latin-500-normal.woff2) format("woff2")}</style></head>
<body>
<div id="view"><div id="wrap">
<div id="stage">
  <div class="cheek" id="cheekL" title=""></div><div class="cheek" id="cheekR"></div>
  <div id="ui">
    <header>
      <svg class="logo" viewBox="0 0 64 64" aria-label="cat"><circle cx="32" cy="32" r="31" fill="#1B0264"/><path d="M12 24 L17 8 L29 17 Q32 16.5 35 17 L47 8 L52 24 Q56 31 52 40 Q47 54 32 54 Q17 54 12 40 Q8 31 12 24Z" fill="#FF7BB1"/><ellipse cx="24" cy="31" rx="3" ry="4.2" fill="#1B0264"/><ellipse cx="40" cy="31" rx="3" ry="4.2" fill="#1B0264"/><path d="M29.5 38 L34.5 38 L32 41.5Z" fill="#FF1383"/><path d="M32 41.5 Q29 46 26 44 M32 41.5 Q35 46 38 44" stroke="#1B0264" stroke-width="1.6" fill="none" stroke-linecap="round"/><path d="M14 38 L24 39 M14 43 L24 41 M50 38 L40 39 M50 43 L40 41" stroke="#FBBDD0" stroke-width="1.3" stroke-linecap="round"/></svg>
      <div class="brand"><b id="prod">MEOW FLIPPER</b><i>STUDIO 87</i></div>
      <div class="sp"></div>
      <div class="pm" data-tip="Presets. Prev and next step through the list. Double click the name to rename. Save keeps your own copy; factory presets are never overwritten.">
        <button class="btn sm" id="pPrev">&#9664;</button>
        <select class="btn" id="pSel"></select>
        <button class="btn sm" id="pNext">&#9654;</button>
        <button class="btn sm" id="pSave">Save</button>
        <button class="btn sm" id="pRen">Rename</button>
        <button class="btn sm" id="pDel">Delete</button>
        <button class="btn sm" id="pExp">Export</button>
        <button class="btn sm" id="pImp">Import</button>
      </div>
      <div class="sp"></div>
      <button class="btn" id="bGuide">Guide</button>
      <button class="btn" id="bSet">Settings</button>
      <button class="btn" id="bAbout">About &amp; Support</button>
    </header>
    <div id="main">
      <div id="disps">
        <div class="disp"><div class="dt">Incoming sound <span id="srcinfo"></span></div>
          <div class="cv" id="cvA" data-tip="The sound you dropped in or captured. Drag a wav onto this display to load it. It is drawn where it will land in the result, so you can see the swell arriving before it."><canvas id="aBase"></canvas><canvas id="aOver"></canvas><div id="dropmsg">DROP A SOUND HERE</div></div></div>
        <div class="disp"><div class="dt">Reverse reverb result <span id="resinfo"></span><span class="seg" id="vsel" data-tip="Show the result waveform, the big EQ view or the pitch view."><button class="btn sm on" id="vW">Wave</button><button class="btn sm" id="vE">EQ</button><button class="btn sm" id="vP">Pitch</button></span><span id="vhint" style="margin-left:auto;color:var(--selt)">&#9834; drag the waveform out to a track</span></div>

</div>

<script>
"use strict";
const PRODUCT="Meow Flipper", VER="v4.14";
const DW=1120, DH=610;
let fs=44100;
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
function lsGet(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}

/* ---------- settings ---------- */
const S=Object.assign({bubbles:true,power:false,theme:"B"},lsGet("rr_settings",{}));
function applyTheme(){document.documentElement.setAttribute("data-theme",S.theme);}
applyTheme();

/* ---------- wood cheeks (PurrOne wood: three colours, fixed seed grain, thin black edge) ---------- */
(function(){
  const c=document.createElement("canvas");c.width=24;c.height=610;const g=c.getContext("2d");
  g.fillStyle="#3d2210";g.fillRect(0,0,24,610);
  let s=20261018;const rnd=()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
  for(let x=0;x<24;x++){
    const r=rnd();
    g.globalAlpha=r<.4?.4:.75; g.fillStyle=r<.4?"#7b4a26":"#5a3419";
    if(r<.78){g.fillRect(x,0,1+(rnd()<.3?1:0),610)}

  for(const d of DBT){const a=Math.pow(10,d/20);for(const s of[-1,1]){const y=Math.round(mid-s*a*hh)+.5;g.beginPath();g.moveTo(ML,y);g.lineTo(W-8,y);g.stroke()}
    g.fillStyle=css("--dim");g.textAlign="right";g.fillText(d===0?"0":String(d),ML-6,mid-a*hh);g.fillText(d===0?"0":String(d),ML-6,mid+a*hh)}

  g.strokeStyle=css("--line");g.beginPath();g.moveTo(ML,Math.round(mid)+.5);g.lineTo(W-8,Math.round(mid)+.5);g.stroke();
  const tot=opts.total;g.textAlign="center";
  if(P.tsync){const bt=60/HOST.bpm,nb=tot/bt,bars=nb>=8;const k0=Math.ceil(-opts.hit/bt-1e-6),k1=Math.floor((tot-opts.hit)/bt+1e-6);const ev=bars?4:Math.max(1,Math.ceil(nb/14));
    for(let k=k0;k<=k1;k++){const t=opts.hit+k*bt,x=ML+t/tot*pw;const bar=k%4===0;g.strokeStyle=bar?css("--line"):css("--grid");g.beginPath();g.moveTo(Math.round(x)+.5,PT);g.lineTo(Math.round(x)+.5,PT+ph);g.stroke();
      if(opts.axis&&k!==0&&k%ev===0&&x>ML+44){g.fillStyle=css("--dim");g.textAlign=x>W-24?"right":x<ML+14?"left":"center";g.fillText((k>0?"+":"")+(bars?k/4:k),x,H-9)}}

    }
  }

  g.fillStyle=css("--a4");g.font="10px "+css("--fm");const lw=g.measureText(opts.label).width;g.textAlign=hx+6+lw>W-10?"right":"left";g.fillText(opts.label,hx+6+lw>W-10?hx-6:hx+6,PT+9);
  return{ML,pw,tot,y0:PT,y1:PT+ph};
}

let mIn=-90,mOut=-90,mInPk=-90,mOutPk=-90,clipIn=false,clipOut=false;
const MRANGE=[-60,6];
function drawMeters(){
  const c=$("#mc"),W=c.parentElement.clientWidth,H=c.parentElement.clientHeight;if(c.width!==W*2||c.height!==H*2){c.width=W*2;c.height=H*2}
  const g=c.getContext("2d");g.setTransform(2,0,0,2,0,0);g.clearRect(0,0,W,H);
  const top=26,bot=H-22,mh=bot-top,mw=40,xs=[8,W-8-40];
  const yOf=d=>bot-(clamp(d,MRANGE[0],MRANGE[1])-MRANGE[0])/(MRANGE[1]-MRANGE[0])*mh;
  g.font="11px "+css("--fm");g.textAlign="center";g.fillStyle=css("--title");g.fillText("IN",xs[0]+mw/2,14);g.fillText("OUT",xs[1]+mw/2,14);
  const lv=[mIn,mOut],pk=[mInPk,mOutPk],cl=[clipIn,clipOut];
  for(let m=0;m<2;m++){
    const x=xs[m];g.fillStyle=css("--display");g.fillRect(x,top,mw,mh);
    g.save();g.beginPath();g.rect(x,yOf(lv[m]),mw,bot-yOf(lv[m]));g.clip();
    const y12=yOf(-12),y0=yOf(0);g.fillStyle=css("--mb");g.fillRect(x,y12,mw,bot-y12);g.fillStyle=css("--mp");g.fillRect(x,y0,mw,y12-y0);g.fillStyle=css("--mk");g.fillRect(x,top,mw,y0-top);g.restore();
    const col=pk[m]>=0?css("--mk"):pk[m]>=-12?css("--mp"):css("--mb");
    g.fillStyle=col;g.fillRect(x,yOf(pk[m])-1,mw,2);
    if(cl[m]){g.fillStyle=css("--mk");g.fillRect(x,top-8,mw,5)}
  }
  g.fillStyle=css("--dim");g.textAlign="center";g.strokeStyle=css("--line");
  for(const d of[6,0,-6,-12,-24,-36,-48,-60]){const y=yOf(d);g.fillText(String(d),W/2,y+4);g.beginPath();g.moveTo(xs[0]+mw,y+.5);g.lineTo(W/2-12,y+.5);g.moveTo(W/2+12,y+.5);g.lineTo(xs[1],y+.5);g.stroke()}
  g.textAlign="center";g.fillStyle=css("--a4");g.fillText(mInPk>-80?mInPk.toFixed(1):"-inf",xs[0]+mw/2,H-7);g.fillText(mOutPk>-80?mOutPk.toFixed(1):"-inf",xs[1]+mw/2,H-7);

let AC=null,AB=null,node=null,gainN=null,an=null,playing=false,pos=0,startAt=0,startPos=0,listen="R";
function ensureAC(){
  if(AC)return AC;
  const C=window.AudioContext||window.webkitAudioContext;
  try{AC=new C({sampleRate:44100})}catch(e){AC=new C()}
  fs=AC.sampleRate;gainN=AC.createGain();an=AC.createAnalyser();an.fftSize=4096;gainN.connect(an);an.connect(AC.destination);return AC;
}
function bufFor(){
  const mk=(l,r)=>{const b=AC.createBuffer(2,l.length,fs);b.copyToChannel(l,0);b.copyToChannel(r,1);return b};
  if(listen==="R"){if(!AB||!AB.res)AB={res:RES.sl?mk(RES.sl,RES.sr):mk(RES.l,RES.r)};return AB.res}
  const gi=db(P.gin),l=new Float32Array(SRC.l.length),r=new Float32Array(SRC.r.length);
  for(let i=0;i<l.length;i++){l[i]=SRC.l[i]*gi;r[i]=SRC.r[i]*gi}return mk(l,r);
}
function curLen(){return listen==="R"?RES.N/fs:SRC.l.length/fs}
function srcPosToDisp(t){return listen==="R"?t:t+RES.off/fs}
function play(){
  if(!RES)return;ensureAC();AC.resume();
  if(playing){pause();return}
  let t=listen==="R"?pos:pos-RES.off/fs;if(t<0||t>=curLen()-0.01)t=0;
  const b=bufFor();node=AC.createBufferSource();node.buffer=b;node.connect(gainN);
  startAt=AC.currentTime;startPos=t;node.start(0,t);playing=true;$("#play").classList.add("on");
  const me=node;me.onended=()=>{if(node===me&&playing){playing=false;$("#play").classList.remove("on");pos=listen==="R"?0:RES.off/fs;drawOver()}};
}
function pause(){if(node){try{node.onended=null;node.stop()}catch(e){}node=null}
  if(playing){const t=AC.currentTime-startAt+startPos;pos=srcPosToDisp(t)}playing=false;$("#play").classList.remove("on")}
function stopAll(){pause();drawOver()}
function seek(t){const was=playing;if(was)pause();pos=clamp(t,0,RES.N/fs);drawOver();if(was)play()}
$("#play").onclick=play;$("#stop").onclick=stopAll;
$("#back").onclick=()=>{const was=playing;if(was)pause();pos=0;drawOver();if(was)play()};
function setListen(m){const was=playing;if(was)pause();listen=m;$("#lsR").classList.toggle("on",m==="R");$("#lsS").classList.toggle("on",m==="S");if(m==="S"&&RES)pos=Math.max(pos,RES.off/fs);if(m==="R"&&RES&&pos<RES.off/fs&&false)pos=0;drawOver();if(was)play()}

$("#impIn").onchange=e=>{const f=e.target.files[0];e.target.value="";if(!f)return;const fr=new FileReader();fr.onload=()=>{
  try{const o=JSON.parse(fr.result);if(o.format!=="studio87-reverse-reverb-preset"||typeof o.p!=="object")throw 0;const p={};for(const k of KNOBS){const v=o.p[k[0]];if(typeof v==="number"&&isFinite(v))p[k[0]]=k[7]&&k[7].step?Math.round(clamp(v,k[2],k[3])):clamp(v,k[2],k[3])}if(validEnv(o.p.penv))p.penv=o.p.penv;
    let n=String(o.name||"Imported").slice(0,40);while(n in FACT)n+=" (imp)";user[n]={test:["Snare","Clap","Vocal Ahh","Synth stab","Kick","Hat"].includes(o.test)?o.test:"Snare",p};lsSet("rr_user",user);fillSel();loadPreset("u:"+n)}
  catch(x){dlg("<h2>Import failed</h2><div>That is not a Meow Flipper preset file. Nothing was changed.</div>",[{t:"OK",primary:1}])}};fr.readAsText(f)};

/* ---------- guide, settings, about ---------- */
$("#bGuide").onclick=()=>dlg("<h2>Guide</h2><ul><li><b>Load or capture</b> a sound: drop a file on the top display, press Load file, or press Capture to record the track the plugin sits on.</li><li>The result below shows the swell building up and landing on your sound. Move any knob and it redraws.</li><li><b>Play</b> (Space), <b>Stop</b>, <b>Back</b> (Home) preview the result. Listen switches to the original sound.</li><li>Drag the <b>result waveform</b> itself onto a track to drop it into your DAW as a wav.</li><li>Pick the reverb type (Hall, Plate, Room, Lexicat Hall, Shimmer) next to the Reverb title and the echo type (Digital, Tape, Ping-pong, Analog) in the Echo caption.</li><li>Timing: the &#9834; button in Timing and mix switches between free and tempo sync. In &#9834; mode both views show bars and beats, and the Length knob (in place of Tail) locks the swell to a note length before the hit.</li><li>Pitch: open Pitch above the result. The knob transposes in cents (up to 3 octaves up or down); drag the line points to make the pitch move over time, double click to add or remove a point.</li><li>EQ: click the curve (or EQ above the result) for the big EQ view, drag the dots, scroll for Q. Each peak can be a Bell or a shelf. The target menu picks Both, Wet only or Dry only. &#9211; turns a band off, S solos it.</li><li>Click the VERB &#8250; ECHO &#8250; COLOR chips in the Reverb title to step through all 6 effect orders (right click goes back).</li><li>Echo: the note button switches the time knob between free milliseconds and a note ratio locked to the host tempo.</li><li>EQ: high pass, two peaks with Q and gain, low pass, with a slope choice in dB per octave.</li><li>Knobs: drag up or down, shift for fine, mouse wheel, double click to reset.</li><li>Click either display to move the play position.</li><li>Double click a wood side to reset the window size. Drag any edge or corner to resize.</li></ul>",[{t:"Close",primary:1}]);
$("#bSet").onclick=()=>dlg("<h2>Settings</h2><label><input type='checkbox' id='sB'> Info bubbles</label><label><input type='checkbox' id='sP'> Power saving (slower animation)</label><label>Colour scheme <select class='btn' id='sT'><option value='A'>Look A, Neon Navy</option><option value='B'>Look B, Purple Soda Pop</option><option value='C'>Look C, PurrOne</option></select></label>",[{t:"Close",primary:1}],d=>{
  d.querySelector("#sB").checked=S.bubbles;d.querySelector("#sP").checked=S.power;d.querySelector("#sT").value=S.theme;
  d.querySelector("#sB").onchange=e=>{S.bubbles=e.target.checked;lsSet("rr_settings",S)};d.querySelector("#sP").onchange=e=>{S.power=e.target.checked;lsSet("rr_settings",S)};
  d.querySelector("#sT").onchange=e=>{S.theme=e.target.value;lsSet("rr_settings",S);applyTheme();drawAll();knobsRedraw();drawEQ()}});
function knobsRedraw(){KNOBS.forEach(k=>drawKnob(k[0]))}
$("#bAbout").onclick=()=>dlg("<h2>About &amp; Support</h2><div><b>Studio 87</b> &middot; "+PRODUCT+" "+VER+" (design mockup)</div><ul><li>Free and open source, AGPL-3.0-or-later.</li><li></li><li>Presets live in your Studio 87 user data folder, under Reverse Reverb, presets.</li><li>Uninstall removes everything except your saved presets, which stay unless you choose to delete them.</li></ul><div><a href='https://ko-fi.com/studio87' target='_blank' rel='noopener' style='color:#02EBBA'>Support on Ko-fi</a> (opens in your browser only when you click)</div>",[{t:"Close",primary:1}]);

/* ---------- window scale: eight handles, aspect locked, cheek double click ---------- */
let defScale=1,scale=1;const wrap=$("#wrap"),stage=$("#stage");
function applyScale(){scale=clamp(scale,0.15,3);curScale=scale;stage.style.transform="scale("+scale+")";wrap.style.width=DW*scale+"px";wrap.style.height=DH*scale+"px";
  $("#szr").textContent=Math.round(DW*scale)+" x "+Math.round(DH*scale)+" ("+Math.round(scale/defScale*100)+"%)";$("#zf").textContent=Math.round(scale/defScale*100)+"%";placeHandles();drawAll();drawMeters();drawEQ()}
function fit(){defScale=Math.min(1,innerWidth/DW,innerHeight/DH);if(defScale<=0)defScale=1}
const HD=[["nw",-1,-1],["n",0,-1],["ne",1,-1],["e",1,0],["se",1,1],["s",0,1],["sw",-1,1],["w",-1,0]];
const hds={};
HD.forEach(([k,sx,sy])=>{const d=document.createElement("div");d.className="hd";d.style.cursor=(k==="n"||k==="s"?"ns":k==="e"||k==="w"?"ew":(k==="nw"||k==="se")?"nwse":"nesw")+"-resize";wrap.appendChild(d);hds[k]=d;
  d.addEventListener("pointerdown",ev=>{ev.preventDefault();d.setPointerCapture(ev.pointerId);const x0=ev.clientX,y0=ev.clientY,s0=scale;
    const mv=e=>{const dx=(e.clientX-x0)*sx*2,dy=(e.clientY-y0)*sy*2;let f=1;
      if(sx&&sy)f=Math.max((DW*s0+dx)/(DW*s0),(DH*s0+dy)/(DH*s0));else if(sx)f=(DW*s0+dx)/(DW*s0);else f=(DH*s0+dy)/(DH*s0);
      scale=s0*f;applyScale()};
    const up=()=>{d.removeEventListener("pointermove",mv);d.removeEventListener("pointerup",up)};d.addEventListener("pointermove",mv);d.addEventListener("pointerup",up)});
});
function placeHandles(){const w=DW*scale,h=DH*scale,t=12,c=18;
  const set=(k,l,tp,wi,he)=>{const s=hds[k].style;s.left=l+"px";s.top=tp+"px";s.width=wi+"px";s.height=he+"px"};
  set("n",c,0,w-2*c,t);set("s",c,h-t,w-2*c,t);set("w",0,c,t,h-2*c);set("e",w-t,c,t,h-2*c);set("nw",0,0,c,c);set("ne",w-c,0,c,c);set("sw",0,h-c,c,c);set("se",w-c,h-c,c,c)}
function resetSize(){scale=defScale;applyScale()}
["#cheekL","#cheekR"].forEach(id=>$(id).addEventListener("dblclick",resetSize));
$("#zm").onclick=()=>{scale/=1.1;applyScale()};$("#zp").onclick=()=>{scale*=1.1;applyScale()};$("#zf").onclick=resetSize;
addEventListener("resize",()=>{const keep=scale/defScale;fit();scale=defScale*keep;applyScale()});

/* ---------- animation loop (paused when hidden) ---------- */
let last=0,visible=true;
document.addEventListener("visibilitychange",()=>{visible=document.visibilityState==="visible"});
new IntersectionObserver(es=>{visible=es[0].isIntersecting&&document.visibilityState==="visible"}).observe(stage);
const tmp=new Float32Array(1024);
function frame(ts){
  requestAnimationFrame(frame);
  if(!visible)return;if(ts-last<(S.power?66:16))return;last=ts;
  let inD=-90,outD=-90;
  if(playing&&AC){
    const t=AC.currentTime-startAt+startPos;pos=srcPosToDisp(t);
    an.getFloatTimeDomainData(tmp);let m=0;for(let i=0;i<tmp.length;i++){const a=Math.abs(tmp[i]);if(a>m)m=a}outD=m>0?20*Math.log10(m):-90;
    if(RES&&SRC){const tt=pos-RES.off/fs;if(tt>=0){const i0=Math.floor(tt*fs);let mm=0;for(let i=i0;i<Math.min(SRC.l.length,i0+2048);i++)mm=Math.max(mm,Math.abs(SRC.l[i]),Math.abs(SRC.r[i]));mm*=db(P.gin);inD=mm>0?20*Math.log10(mm):-90}}
    if(EQV){const fd=new Float32Array(an.frequencyBinCount);an.getFloatFrequencyData(fd);liveSpec=fd.map(v=>v+6);drawEqBig()}else if(PV)drawPitch();else drawOver();
  }else if(liveSpec){liveSpec=null;if(EQV)drawEqBig()}
  mIn=inD>mIn?inD:Math.max(inD,mIn-1.4);mOut=outD>mOut?outD:Math.max(outD,mOut-1.4);
  if(inD>mInPk||!playing&&false)mInPk=inD;if(outD>mOutPk)mOutPk=outD;
  if(inD>=0)clipIn=true;if(outD>=0)clipOut=true;
  if(!playing){mInPk=Math.max(-90,mInPk-0.15);mOutPk=Math.max(-90,mOutPk-0.15)}
  drawMeters();
}

/* ---------- start ---------- */
(function init(){
  fit();scale=defScale;applyScale();
  fillSel();syncAll();
  $("#testSel").value="Snare";SRC=genSource("Snare");render();
  requestAnimationFrame(frame);
  $("#meters").addEventListener("dblclick",()=>{clipIn=clipOut=false;mInPk=mOutPk=-90});
  window.__rr={P,KD,HOST,render,setEqView,setView,centsAt,drawEqBig,bandSecs,get SOLO(){return SOLO},set SOLO(v){SOLO=v;makeSolo()},eqSections,echoMs,get RES(){return RES},get SRC(){return SRC},setParam,genSource,setSource,loadPreset,FACT,KNOBS};
})();
</script>
