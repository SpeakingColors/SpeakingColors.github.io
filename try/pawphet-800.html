{
const P=document.getElementById('panel'), SY=document.getElementById('synth');

function el(tag,css,html,parent=P){const e=document.createElement(tag);if(css)e.style.cssText=css;if(html!=null)e.innerHTML=html;parent.appendChild(e);return e}
function hiDPI(c,w,h){const d=2;c.width=w*d;c.height=h*d;c.style.width=w+'px';c.style.height=h+'px';const x=c.getContext('2d');x.setTransform(d,0,0,d,0,0);return x}
const store={get(k){try{return JSON.parse(localStorage.getItem('pawphet.'+k))}catch(e){return null}},set(k,v){try{localStorage.setItem('pawphet.'+k,JSON.stringify(v))}catch(e){}}};

// ================= parameters =================
const tms=x=>0.001*Math.pow(10000,Math.pow(Math.max(0,x),0.6));
const fmtT=s=>s<1?Math.round(s*1000)+' ms':s.toFixed(s<10?2:1)+' s';
const fmtHz=f=>f<1000?Math.round(f)+' Hz':(f/1000).toFixed(2)+' kHz';
const pct=v=>Math.round(v*100)+'%';
const feet=o=>["32'","16'","8'","4'","2'"][o+2];
const DIVS=['1 bar','1/2','1/4','1/8','1/16','1/32'];
const PD={ // id: [min,max,int,fmt,tip]
 pmFenv:[0,1,0,pct,'<b>Poly Mod: Filter Env amount.</b> How far the filter envelope bends the destinations below (Osc A pitch and/or the filter). Great for sync sweeps and zaps.'],
 pmOscB:[0,1,0,pct,'<b>Poly Mod: Osc B amount.</b> Osc B modulates Osc A pitch (FM bells, metallic tones) and/or the filter at audio rate.'],
 lfoRate:[0,1,0,v=>S.lfoMode===1?DIVS[Math.min(5,Math.floor(v*6))]:(0.05*Math.pow(600,v)).toFixed(2)+' Hz','<b>LFO rate.</b> Free in Hz, or tempo divisions when the LFO mode is Sync.'],
 lfoAmt:[0,1,0,pct,'<b>LFO amount.</b> Depth to the destinations lit below: pitch (up to 2 semitones), pulse width, filter (up to 3 octaves).'],
 glide:[0,1,0,v=>v<0.001?'off':fmtT(0.002+2.5*v*v),'<b>Glide.</b> Notes slide in pitch to the next note. Off at zero.'],
 drift:[0,1,0,v=>(v*6).toFixed(1)+' ct','<b>Drift.</b> Each voice wanders a few cents on its own, like analog oscillators, so chords breathe.'],
 uniVoices:[1,16,1,v=>String(v),'<b>Stack and unison voices.</b> How many detuned voices play on each note in STACK mode, or on the one note in UNISON mode.'],

let demoOn=false,demoKey='chords',demoIdx=0;
const DS=document.getElementById('demoSel'),DV=document.getElementById('demoVar');
const DCAT=[['chords','CHORDS'],['pluck','PLUCK'],['arp','ARP'],['lead','LEAD'],['hoover','HOOVER'],['brass','BRASS'],['stab','STAB'],['keys','KEYS'],['bass','BASS'],['acid','ACID']];
function drawDemo(){DS.innerHTML=DCAT.map(([k,n])=>`<button class="tbb ${k===demoKey?'on':''}" data-d="${k}">${n}</button>`).join(' ');
 DS.querySelectorAll('[data-d]').forEach(b=>b.addEventListener('click',()=>{selDemo(b.dataset.d);if(demoOn)startDemo();}));
 const l=DEMOS[demoKey],d=l[demoIdx];DV.innerHTML=`<button class="tbb" id="dvP">◂</button><span id="dvName"><b>${d.name}</b><br><i>${d.k} · ${d.bpm} BPM · ${demoIdx+1}/${l.length}</i></span><button class="tbb" id="dvN">▸</button>`;
 document.getElementById('dvP').onclick=()=>stepDemo(-1);document.getElementById('dvN').onclick=()=>stepDemo(1);}
function stepDemo(s){const l=DEMOS[demoKey];demoIdx=(demoIdx+s+l.length)%l.length;drawDemo();if(demoOn)startDemo();}
function selDemo(k,genre){if(!DEMOS[k])k='chords';demoKey=k;const l=DEMOS[k];let i=genre?l.findIndex(d=>d.g===genre):-1;demoIdx=i>=0?i:0;drawDemo();}
function startDemo(){const d=DEMOS[demoKey][demoIdx];setParam('bpm',d.bpm);send({type:'demo',ev:d.ev.slice().sort((a,b)=>a[0]-b[0]),len:d.len});}
const PLAY=document.getElementById('playBtn');
PLAY.addEventListener('click',async()=>{await startAudio();demoOn=!demoOn;PLAY.classList.toggle('on',demoOn);PLAY.textContent=demoOn?'■ STOP DEMO':'▶ PLAY DEMO';if(demoOn)startDemo();else send({type:'demo'});});
document.getElementById('panicBtn').addEventListener('click',()=>{send({type:'panic'});heldUI.clear();kbAll();demoOn=false;PLAY.classList.remove('on');PLAY.textContent='▶ PLAY DEMO';});
